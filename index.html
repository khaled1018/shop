<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop - ShopHub</title>
  <link href="vendor/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <div id="message"></div>

  <main class="container py-4">
    <h2 class="mb-3">Products</h2>
    <div class="row g-2 mb-4">
      <div class="col-md-4"><input class="form-control" id="search" placeholder="Search by name"></div>
      <div class="col-md-3"><select class="form-select" id="category"><option value="">All categories</option></select></div>
      <div class="col-md-2"><input type="number" min="0" class="form-control" id="maxPrice" placeholder="Max price"></div>
      <div class="col-md-3 d-flex align-items-center">
        <div class="form-check"><input class="form-check-input" type="checkbox" id="inStock"><label class="form-check-label" for="inStock">In stock only</label></div>
      </div>
    </div>
    <div class="row g-3" id="products"></div>
  </main>

  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
