<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admins - ShopHub</title>
  <link href="vendor/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <div id="message"></div>

  <main class="container py-4">
    <h2 class="mb-3">Admins</h2>
    <form id="admin-form" novalidate class="card card-body mb-4 col-md-6">
      <h5>Add another admin</h5>
      <div class="mb-3"><label class="form-label" for="name">Name</label><input class="form-control" id="name"><div class="invalid-feedback" id="name-error"></div></div>
      <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email"><div class="invalid-feedback" id="email-error"></div></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password"><div class="invalid-feedback" id="password-error"></div></div>
      <div><button class="btn btn-primary">Add admin</button></div>
    </form>
    <table class="table bg-white">
      <thead><tr><th>Name</th><th>Email</th></tr></thead>
      <tbody id="admins-table"></tbody>
    </table>
  </main>

  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/admin-admins.js"></script>
</body>
</html>
