<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - ShopHub</title>
  <link href="vendor/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <div id="message"></div>

  <main class="container py-4">
    <div class="row justify-content-center"><div class="col-md-5">
      <h2>Create account</h2>
      <form id="register-form" novalidate>
        <div class="mb-3"><label class="form-label" for="name">Full name</label><input class="form-control" id="name"><div class="invalid-feedback" id="name-error"></div></div>
        <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email"><div class="invalid-feedback" id="email-error"></div></div>
        <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password"><div class="invalid-feedback" id="password-error"></div></div>
        <div class="mb-3"><label class="form-label" for="confirm">Confirm password</label><input class="form-control" id="confirm" type="password"><div class="invalid-feedback" id="confirm-error"></div></div>
        <button class="btn btn-primary w-100">Register</button>
      </form>
      <p class="mt-3 small">Already have an account? <a href="login.html">Login</a></p>
    </div></div>
  </main>

  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
