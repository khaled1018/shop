<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products - ShopHub</title>
  <link href="vendor/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <div id="message"></div>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>Products</h2>
      <button class="btn btn-outline-primary btn-sm" id="import-btn">Import from FakeStore API</button>
    </div>
    <form id="product-form" novalidate class="card card-body mb-4">
      <h5 id="form-title">Add product</h5>
      <div class="row">
        <div class="col-md-6">
          <div class="mb-3"><label class="form-label" for="name">Name</label><input class="form-control" id="name"><div class="invalid-feedback" id="name-error"></div></div>
          <div class="mb-3"><label class="form-label" for="image">Image URL</label><input class="form-control" id="image"><div class="invalid-feedback" id="image-error"></div></div>
          <div class="mb-3"><label class="form-label" for="categoryId">Category</label><select class="form-select" id="categoryId"></select><div class="invalid-feedback" id="categoryId-error"></div></div>
        </div>
        <div class="col-md-6">
          <div class="mb-3"><label class="form-label" for="price">Price</label><input class="form-control" id="price" type="number" step="0.01"><div class="invalid-feedback" id="price-error"></div></div>
          <div class="mb-3"><label class="form-label" for="stock">Stock quantity</label><input class="form-control" id="stock" type="number"><div class="invalid-feedback" id="stock-error"></div></div>
          <div class="mb-3"><label class="form-label" for="description">Description</label><input class="form-control" id="description"><div class="invalid-feedback" id="description-error"></div></div>
        </div>
      </div>
      <div><button class="btn btn-primary" id="save-btn">Add</button> <button type="button" class="btn btn-link d-none" id="cancel-btn">Cancel</button></div>
    </form>
    <div class="table-responsive">
      <table class="table bg-white align-middle">
        <thead><tr><th></th><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead>
        <tbody id="products-table"></tbody>
      </table>
    </div>
  </main>

  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/admin-products.js"></script>
</body>
</html>
